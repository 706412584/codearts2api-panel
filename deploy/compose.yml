# Production only: use deploy.sh to supply an immutable IMAGE_REF and DEPLOY_DIR.
# Local source builds continue to use ../docker-compose.yml.
services:
  codearts2api-panel:
    image: "${IMAGE_REF:?Set IMAGE_REF to the published GHCR image}"
    restart: unless-stopped
    # /app is owned by this user in the image, including config-save temp files.
    user: "10001:10001"
    ports:
      - "127.0.0.1:7866:7866"
    environment:
      TZ: Asia/Shanghai
      CA2A_LISTEN: ":7866"
      CA2A_AUTH_DIR: /app/auths
      CA2A_STATE_FILE: /app/data/state.json
    volumes:
      - type: bind
        source: "${DEPLOY_DIR:?Set DEPLOY_DIR}/config.json"
        target: /app/config.json
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOY_DIR:?Set DEPLOY_DIR}/auths"
        target: /app/auths
        bind:
          create_host_path: false
      - type: bind
        source: "${DEPLOY_DIR:?Set DEPLOY_DIR}/data"
        target: /app/data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
